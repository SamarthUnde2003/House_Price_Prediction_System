<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glossy Login</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>

        <form action="logincheck" method="post">
            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter your email"  name="email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" name="password" required>
            </div>
        
            <button type="submit">Login</button>
            
            <div class="register">
                Don't have an account? <a href="./register.html" style="color: black;">Register</a>
            </div>
        </form>
    </div>

</body>
</html>
