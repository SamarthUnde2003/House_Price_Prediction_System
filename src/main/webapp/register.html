<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="login-box">
      <h2>Register</h2>

      <form action="RegisterUser" method="post">
        <div class="input-box">
          <label>Email</label>
          <input type="email" placeholder="Enter your email" name="email" required />
        </div>

        <div class="input-box">
          <label>Password</label>
          <input type="password" placeholder="Create password" name="pass1" required />
        </div>

        <div class="input-box">
          <label>Confirm Password</label>
          <input type="password" placeholder="Confirm password" name="pass2" required />
        </div>

        <button type="submit">Register</button>

        <div class="register">
          Already have an account? <a href="./login.html" style="color: black;">Login</a>
        </div>
      </form>
    </div>
  </body>
</html>
